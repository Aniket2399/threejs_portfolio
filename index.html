    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          // Default to light; a visitor's explicit toggle choice still wins.
          if (t !== "light" && t !== "dark") {
            t = "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
